[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "asr-normalizer"
dynamic = ["version"]
description = "The text normalizer used by the Open ASR Leaderboard (Whisper's normalizer plus the leaderboard's patches); the Open TTS Leaderboard is migrating to it."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Hugging Face audio team" },
    { name = "The Agentic Data Company (Matias Voldby Drejer)" },
]
keywords = ["asr", "speech-recognition", "wer", "text-normalization", "whisper", "leaderboard", "tts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "regex",
    # Pinned: normalized output depends on the num2words version (it differs on 0.5.10 and 0.5.6).
    "num2words>=0.5.12,<0.6",
]

[project.optional-dependencies]
dev = ["pytest"]
# Only for the full golden sweep (ASR_NORMALIZER_FULL=1 pytest -m full), which re-fetches the transcripts.
full = ["huggingface_hub", "pyarrow"]

[project.scripts]
asr-normalize = "asr_normalizer.cli:main"

[project.urls]
Homepage = "https://github.com/MatiasVoldbyDrejer/asr-normalizer"
Repository = "https://github.com/MatiasVoldbyDrejer/asr-normalizer"
Issues = "https://github.com/MatiasVoldbyDrejer/asr-normalizer/issues"
Changelog = "https://github.com/MatiasVoldbyDrejer/asr-normalizer/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "asr_normalizer/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["asr_normalizer"]

[tool.hatch.build.targets.sdist]
include = [
    "/asr_normalizer",
    "/tests",
    "/scripts",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/NOTICE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
