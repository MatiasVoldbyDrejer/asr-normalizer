# Builds the sdist and wheel, tests the built wheel, and publishes both to PyPI with trusted publishing
# (OIDC; no API tokens or secrets).
#
# BEFORE the first v* tag is pushed, PyPI must have this trusted publisher (a "pending" publisher if the
# `asr-normalizer` project does not exist on PyPI yet). This file does not register it; someone has to, on PyPI:
#   owner:       MatiasVoldbyDrejer
#   repository:  asr-normalizer
#   workflow:    release.yml
#   environment: pypi
# After the repository is transferred to the `huggingface` GitHub organization, the PyPI project owner
# (Hugging Face) must update the binding to owner `huggingface`; until then, publishing from the transferred
# repository fails.
#
# Pushing a tag vX.Y.Z runs build -> test -> publish; the build fails unless X.Y.Z equals the version in the
# built wheel and sdist. workflow_dispatch runs build and test only: publish runs on tag refs only.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check the tag against the built version
        run: |
          python - <<'PY'
          import glob, os, sys, tarfile, zipfile
          from email.parser import Parser

          (wheel,), (sdist,) = glob.glob("dist/*.whl"), glob.glob("dist/*.tar.gz")
          with zipfile.ZipFile(wheel) as z:
              meta = next(n for n in z.namelist() if n.endswith(".dist-info/METADATA"))
              wheel_version = Parser().parsestr(z.read(meta).decode("utf-8"))["Version"]
          with tarfile.open(sdist) as t:
              meta = next(m for m in t.getmembers() if m.name.count("/") == 1 and m.name.endswith("/PKG-INFO"))
              sdist_version = Parser().parsestr(t.extractfile(meta).read().decode("utf-8"))["Version"]
          print(f"wheel: {wheel_version}  sdist: {sdist_version}  ref: {os.environ['GITHUB_REF']}")
          if wheel_version != sdist_version:
              sys.exit("wheel and sdist versions differ")
          ref = os.environ["GITHUB_REF"]
          if ref.startswith("refs/tags/v") and ref[len("refs/tags/v"):] != wheel_version:
              sys.exit(f"tag {ref[len('refs/tags/'):]} does not match the package version {wheel_version}")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Same as the `wheel` job in ci.yml: install the built wheel (not editable) into a fresh venv and run the
  # test suite from outside the checkout, so the source tree is not importable.
  test:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Test the built wheel
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          source "$RUNNER_TEMP/venv/bin/activate"
          python -m pip install dist/*.whl pytest
          cp -R tests "$RUNNER_TEMP/tests"
          cd "$RUNNER_TEMP"
          python -c "import asr_normalizer; print(asr_normalizer.__file__); assert 'site-packages' in asr_normalizer.__file__"
          python -m pytest -q -p no:cacheprovider --rootdir "$RUNNER_TEMP" "$RUNNER_TEMP/tests"

  publish:
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
