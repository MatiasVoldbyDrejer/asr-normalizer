name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  # Builds the sdist and wheel, installs the wheel (not editable) into a fresh venv, and runs the test suite
  # from outside the checkout, so a file missing from the wheel fails here instead of after a release.
  wheel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Test the installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          source "$RUNNER_TEMP/venv/bin/activate"
          python -m pip install dist/*.whl pytest
          cp -R tests "$RUNNER_TEMP/tests"
          cd "$RUNNER_TEMP"
          python -c "import asr_normalizer; print(asr_normalizer.__file__); assert 'site-packages' in asr_normalizer.__file__"
          python -m pytest -q -p no:cacheprovider --rootdir "$RUNNER_TEMP" "$RUNNER_TEMP/tests"
